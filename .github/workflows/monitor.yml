name: Egypt price discovery
on:
  push:
    branches: [main]
    paths: ['cloud.py', 'direct.py', 'tests/**', '.github/workflows/monitor.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: price-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test rules
        run: python -m unittest discover -s tests -v
      - name: Discover and poll up to twelve product pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u cloud.py
      - name: Persist price history, including after partial failure
        if: always()
        run: |
          if [ -f private/catalog.sqlite3 ]; then
            git config user.name 'price-monitor'
            git config user.email 'price-monitor@users.noreply.github.com'
            git add -f private/catalog.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m 'Update observed prices'
              git push
            fi
          fi
