name: Noon source access probe
on:
  push:
    paths: ['.github/workflows/noon-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public catalog from this runner
        shell: python
        run: |
          import urllib.request, urllib.robotparser, time, re
          base='https://www.noon.com'
          ua='EgyptSmartDealsHunter/0.7 (public catalog compatibility test)'
          url=base+'/egypt-en/electronics-and-mobiles/mobiles-and-accessories/mobiles-20905/smartphones/'
          def read(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':ua}),timeout=25) as r:
                  b=r.read(4000001)
                  if len(b)>4000000: raise RuntimeError('Oversized response')
                  return b.decode()
          robots=read(base+'/robots.txt')
          if 'user-agent:' not in robots.lower(): raise RuntimeError('Invalid robots')
          rules=urllib.robotparser.RobotFileParser(); rules.parse(robots.splitlines())
          if not rules.can_fetch(ua,url): raise RuntimeError('robots disallows source')
          time.sleep(20)
          html=read(url)
          if any(x in html.lower() for x in ['cf-chl-','challenge-platform','verify you are human']): raise RuntimeError('Human verification required; stopping')
          count=html.count('data-qa="plp-product-box-name"')
          print('Noon public catalog cards:',count)
          if not count: raise RuntimeError('No visible product cards; source not verified')
